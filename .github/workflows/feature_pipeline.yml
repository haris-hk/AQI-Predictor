name: Feature pipeline (hourly)

on:
  schedule:
    # Every hour. GitHub's scheduler is best-effort and drifts by minutes, which
    # is why the pipeline re-fetches an overlapping window and upserts instead of
    # assuming the previous run happened.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore pipeline state
        run: ./scripts/data_branch.sh restore

      - name: Fetch and engineer features
        run: python -m src.pipelines.features

      - name: Compute the 3-day forecast
        # Skipped silently until the first model has been trained.
        run: python -m src.pipelines.predict || echo "no model yet; skipping inference"

      - name: Check hazard alerts
        run: python -m src.pipelines.alerts || echo "alert step failed; continuing"

      - name: Persist pipeline state
        run: ./scripts/data_branch.sh save "hourly features $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Open an issue if the pipeline is failing
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Feature pipeline failing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline-failure',
            });
            const body = `The hourly feature pipeline failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline-failure'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            }
